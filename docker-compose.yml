services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: Alek20089583
      MYSQL_DATABASE: assistant
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  qdrant:
    image: qdrant/qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/var/lib/qdrant

volumes:
  mysql_data:
  qdrant_data: